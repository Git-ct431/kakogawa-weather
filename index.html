<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気ツール</title>
</head>
<body>
    <div id="app"></div>

    <script>
        const style = document.createElement('style');
        style.textContent = `
            body { font-family: monospace; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; margin: 0; }
            header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
            h1 { font-size: 1.2rem; color: #4ec9b0; margin: 0; border: none; padding: 0; }
            .update-info { font-size: 0.85rem; color: #9cdcfe; }
            .tab-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
            .tab-btn { background-color: #2d2d2d; color: #d4d4d4; border: 1px solid #404040; padding: 6px 14px; cursor: pointer; font-family: monospace; border-radius: 4px; }
            .tab-btn.active { background-color: #0e639c; border-color: #1177bb; color: #ffffff; }
            .page-pane { display: none; }
            .page-pane.active { display: block; }
            .fixed-size-pane { width: 1060px; height: 2180px; background-color: #252526; border: 1px solid #333; overflow: auto; box-sizing: border-box; padding: 20px; border-radius: 6px; }
            .weather-section { margin-bottom: 20px; }
            .weather-section h2 { font-size: 1.2rem; color: #4ec9b0; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
            
            /* --- 共通のテーブルスタイル --- */
            .table-style-1 { width: auto; height: auto; border-collapse: collapse; background-color: #1e1e1e; border: 1px solid #333; font-size: 0.9rem; }
            .table-style-1 th, .table-style-1 td { text-align: center; border-bottom: none; border-right: 1px solid #333; white-space: nowrap; padding: 1px 4px; }
            .table-style-1 td { border-bottom: none; }
            .table-style-1 th:last-child, .table-style-1 td:last-child { border-right: none; }
            
            /* ヘッダーの文字を下揃え（縦書きの下部寄せ）に修正 */
            .table-style-1 th { 
                background-color: #2d2d2d; 
                color: #4ec9b0; 
                font-weight: bold; 
                writing-mode: vertical-rl; 
                text-orientation: upright; 
                padding: 6px 2px; 
                height: 90px; 
                vertical-align: bottom; 
                position: relative; 
            }
            .table-style-1 th span { 
                display: inline-block; 
                position: absolute;
                bottom: 6px; 
                left: 50%;
                transform: translateX(-50%);
            }

            /* 現在時刻が含まれる行の下線スタイル */
            .table-style-1 tr.current-time-row td {
                border-bottom: 2px solid #4ec9b0 !important;
            }

            /* 数値0の半透明 */
            .val-zero {
                color: #777777 !important;
                opacity: 0.6;
            }

            /* 3℃刻みの温度カラーマップ（5つずつ配置） */
            .temp-b3 { background-color: #0c1824; color: #9ac2ff; } .temp-b2 { background-color: #0e1d2c; color: #9ac2ff; } .temp-b1 { background-color: #102334; color: #92b8ea; } .temp-b0 { background-color: #12283c; color: #9cdcfe; } .temp-g0 { background-color: #132a28; color: #9cdcfe; }
            .temp-g1 { background-color: #142d1e; color: #b5cea8; } .temp-g2 { background-color: #163116; color: #b5cea8; } .temp-g3 { background-color: #153722; color: #ffffff; } .temp-r0 { background-color: #282d12; color: #d4cc8c; } .temp-r1 { background-color: #332710; color: #d4cc8c; }
            .temp-r2 { background-color: #331e10; color: #e8b894; } .temp-r3 { background-color: #331310; color: #e89494; } .temp-r4 { background-color: #330e0e; color: #e89494; } .temp-r5 { background-color: #2c0919; color: #e894c7; }

            .warning-region-block { margin-bottom: 8px; background-color: #1e1e1e; border: 1px solid #333; padding: 6px 12px; border-radius: 4px; }
            .warning-region-title { font-size: 1.05rem; color: #9cdcfe; font-weight: bold; margin-bottom: 2px; border-bottom: 1px dotted #404040; padding-bottom: 2px; }
            .warning-item-row { display: flex; gap: 15px; margin: 1px 0; font-size: 0.95rem; }
            .warning-none { color: #858585; margin: 1px 0; }
            ul { list-style-type: none; padding-left: 20px; margin: 4px 0; border-left: 1px dotted #404040; }
            li.collapsed > ul { display: none; }
            li { margin: 2px 0; }
            .key { color: #9cdcfe; font-weight: bold; }
            .string { color: #ce9178; }
            .number { color: #b5cea8; }
            .boolean, .null { color: #569cd6; }
            .type-tag { font-size: 0.8rem; color: #858585; margin-left: 6px; cursor: pointer; user-select: none; }
            .toggle-btn { background: none; border: none; color: #4ec9b0; cursor: pointer; font-family: monospace; font-size: 0.9rem; padding: 0 4px 0 0; }
            .error { color: #f44747; }
        `;
        document.head.appendChild(style);

        let lastKnownUpdateTime = null;
        let isFirstLoad = true;
        let pollTimer = null;
        let isFetching = false;

        function getTempClass(key, val) {
            if (!key.includes('気温')) return '';
            const num = parseFloat(val);
            if (isNaN(num)) return '';
            const idx = Math.floor(num / 3);
            if (idx <= -2) return 'temp-b3';
            if (idx === -1) return 'temp-b2';
            if (idx === 0) return 'temp-b1';
            if (idx === 1) return 'temp-b0';
            if (idx === 2) return 'temp-g0';
            if (idx === 3) return 'temp-g1';
            if (idx === 4) return 'temp-g2';
            if (idx === 5) return 'temp-g3';
            if (idx === 6) return 'temp-r0';
            if (idx === 7) return 'temp-r1';
            if (idx === 8) return 'temp-r2';
            if (idx === 9) return 'temp-r3';
            if (idx === 10) return 'temp-r4';
            return 'temp-r5';
        }

        const renderTable = (data, container, highlightIndex = -1, customClassFn = null) => {
            if (!data.length) return;
            const keys = Object.keys(data[0]);
            
            const tbodyHtml = data.map((h, rowIndex) => {
                const rowClass = (rowIndex === highlightIndex) ? 'current-time-row' : '';

                const cellsHtml = keys.map(k => {
                    const val = h[k] ?? '-';
                    let cls = customClassFn ? customClassFn(k, val) : '';
                    
                    if (val === 0 || val === '0' || val === 0.0) {
                        cls = cls ? `${cls} val-zero` : 'val-zero';
                    }

                    return `<td${cls ? ` class="${cls}"` : ''}>${val}</td>`;
                }).join('');

                return `<tr${rowClass ? ` class="${rowClass}"` : ''}>${cellsHtml}</tr>`;
            }).join('');

            container.innerHTML = `<table class="table-style-1"><thead><tr>${keys.map(k => `<th><span>${k}</span></th>`).join('')}</tr></thead><tbody>${tbodyHtml}</tbody></table>`;
        };

        function findCurrentTimeIndex(rawDataList) {
            if (!rawDataList || !rawDataList.length) return -1;
            const now = new Date();
            const targetHourStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}`;
            
            let matchedIndex = -1;
            rawDataList.forEach((item, idx) => {
                if (item.時刻 && item.時刻.startsWith(targetHourStr)) {
                    matchedIndex = idx;
                }
            });
            return matchedIndex;
        }

        async function fetchAndUpdateViewer() {
            if (isFetching) return;
            isFetching = true;

            const app = document.getElementById('app');
            
            if (isFirstLoad) {
                const header = document.createElement('header');
                const title = document.createElement('h1');
                title.textContent = '天気ツール';
                header.appendChild(title);

                const updateInfo = document.createElement('div');
                updateInfo.id = 'update-info';
                updateInfo.className = 'update-info';
                updateInfo.textContent = '更新時刻を確認中...';
                header.appendChild(updateInfo);
                app.appendChild(header);

                const tabNav = document.createElement('div');
                tabNav.className = 'tab-nav';
                
                const btnPage1 = document.createElement('button');
                btnPage1.className = 'tab-btn active';
                btnPage1.textContent = 'ページ1: JSONデバッグ';
                btnPage1.onclick = () => switchTab('page1', btnPage1);
                tabNav.appendChild(btnPage1);

                const btnPage2 = document.createElement('button');
                btnPage2.className = 'tab-btn';
                btnPage2.textContent = 'ページ2: 1時間天気';
                btnPage2.onclick = () => switchTab('page2', btnPage2);
                tabNav.appendChild(btnPage2);

                const btnPage3 = document.createElement('button');
                btnPage3.className = 'tab-btn';
                btnPage3.textContent = 'ページ3: 3時間天気';
                btnPage3.onclick = () => switchTab('page3', btnPage3);
                tabNav.appendChild(btnPage3);

                const btnPage4 = document.createElement('button');
                btnPage4.className = 'tab-btn';
                btnPage4.textContent = 'ページ4: 10日天気';
                btnPage4.onclick = () => switchTab('page4', btnPage4);
                tabNav.appendChild(btnPage4);

                const btnPage5 = document.createElement('button');
                btnPage5.className = 'tab-btn';
                btnPage5.textContent = 'ページ5: 気象警報';
                btnPage5.onclick = () => switchTab('page5', btnPage5);
                tabNav.appendChild(btnPage5);

                app.appendChild(tabNav);

                const pane1 = document.createElement('div');
                pane1.id = 'pane-page1';
                pane1.className = 'page-pane active';
                const container1 = document.createElement('main');
                container1.id = 'content-container';
                pane1.appendChild(container1);
                app.appendChild(pane1);

                const pane2 = document.createElement('div');
                pane2.id = 'pane-page2';
                pane2.className = 'page-pane fixed-size-pane';
                const container2 = document.createElement('div');
                container2.id = 'weather-1h-container';
                pane2.appendChild(container2);
                app.appendChild(pane2);

                const pane3 = document.createElement('div');
                pane3.id = 'pane-page3';
                pane3.className = 'page-pane fixed-size-pane';
                const container3 = document.createElement('div');
                container3.id = 'weather-3h-container';
                pane3.appendChild(container3);
                app.appendChild(pane3);

                const pane4 = document.createElement('div');
                pane4.id = 'pane-page4';
                pane4.className = 'page-pane fixed-size-pane';
                const container4 = document.createElement('div');
                container4.id = 'weather-10d-container';
                pane4.appendChild(container4);
                app.appendChild(pane4);

                const pane5 = document.createElement('div');
                pane5.id = 'pane-page5';
                pane5.className = 'page-pane fixed-size-pane';
                const container5 = document.createElement('div');
                container5.id = 'weather-warnings-container';
                pane5.appendChild(container5);
                app.appendChild(pane5);
            }

            try {
                const response = await fetch(`data.json?_=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const jsonData = await response.json();
                
                const currentUpdateTime = jsonData.my_json_updatetime || '不明';
                const updateInfoEl = document.getElementById('update-info');
                if (updateInfoEl) updateInfoEl.textContent = `データ更新時刻: ${currentUpdateTime}`;

                if (isFirstLoad || lastKnownUpdateTime !== currentUpdateTime) {
                    lastKnownUpdateTime = currentUpdateTime;

                    document.getElementById('content-container').innerHTML = '';
                    document.getElementById('content-container').appendChild(createDebugList(jsonData));

                    document.getElementById('weather-1h-container').innerHTML = '';
                    document.getElementById('weather-1h-container').appendChild(create1HourWeatherView(jsonData));

                    document.getElementById('weather-3h-container').innerHTML = '';
                    document.getElementById('weather-3h-container').appendChild(create3HourWeatherView(jsonData));

                    document.getElementById('weather-10d-container').innerHTML = '';
                    document.getElementById('weather-10d-container').appendChild(create10DayWeatherView(jsonData));

                    document.getElementById('weather-warnings-container').innerHTML = '';
                    document.getElementById('weather-warnings-container').appendChild(createWeatherWarningsView(jsonData));

                    isFirstLoad = false;
                }
            } catch (error) {
                if (isFirstLoad) {
                    document.getElementById('content-container').innerHTML = `<span class="error">データの読み込みに失敗しました: ${error.message}</span>`;
                } else {
                    console.warn(`バックグラウンドでのデータ確認に失敗しました: ${error.message}`);
                }
            } finally {
                isFetching = false;
                if (!document.hidden) scheduleNextCheck();
            }
        }

        function switchTab(targetId, activeBtn) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page-pane').forEach(pane => pane.classList.remove('active'));

            activeBtn.classList.add('active');
            document.getElementById(`pane-${targetId}`).classList.add('active');
        }

        function scheduleNextCheck() {
            if (pollTimer) clearTimeout(pollTimer);
            let delayMs = 60000;
            if (lastKnownUpdateTime) {
                const updateTimeMs = new Date(lastKnownUpdateTime.replace(' ', 'T') + '+09:00').getTime();
                const nowMs = Date.now();
                const tenMinutesMs = 10 * 60 * 1000;
                const elapsedMs = nowMs - updateTimeMs;
                delayMs = (elapsedMs < tenMinutesMs) ? (tenMinutesMs - elapsedMs) : 60000;
            }
            pollTimer = setTimeout(fetchAndUpdateViewer, delayMs);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (pollTimer) clearTimeout(pollTimer);
                fetchAndUpdateViewer();
            } else {
                if (pollTimer) clearTimeout(pollTimer);
            }
        });

        function create1HourWeatherView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>1時間ごとの天気（詳細データのみ）</h2>';

            if (data.my_weather_1h && data.my_weather_1h.length > 0) {
                const container = document.createElement('div');
                const targetIndex = findCurrentTimeIndex(data.my_weather_1h);
                const detailsList = data.my_weather_1h.map(h => h.詳細 || {});
                renderTable(detailsList, container, targetIndex, getTempClass);
                sec.appendChild(container);
            } else {
                sec.innerHTML += '<p>データがありません。</p>';
            }

            wrapper.appendChild(sec);
            return wrapper;
        }

        function create3HourWeatherView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>3時間ごとの天気</h2>';

            if (data.my_weather_3h && data.my_weather_3h.length > 0) {
                const container = document.createElement('div');
                const targetIndex = findCurrentTimeIndex(data.my_weather_3h);
                const detailsList = data.my_weather_3h.map(h => h.詳細 || {});
                renderTable(detailsList, container, targetIndex, getTempClass);
                sec.appendChild(container);
            } else {
                sec.innerHTML += '<p>データがありません。</p>';
            }

            wrapper.appendChild(sec);
            return wrapper;
        }

        function create10DayWeatherView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>10日間の天気（週間）</h2>';

            if (data.my_weather_1day && data.my_weather_1day.length > 0) {
                const container = document.createElement('div');
                // ページ2（1時間天気）の処理を流用
                const detailsList = data.my_weather_1day.map(h => h.詳細 || {});
                renderTable(detailsList, container, -1, getTempClass);
                sec.appendChild(container);
            } else {
                sec.innerHTML += '<p>データがありません。</p>';
            }

            wrapper.appendChild(sec);
            return wrapper;
        }

        function createWeatherWarningsView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>気象警報・注意報</h2>';

            const regions = [
                { key: 'my_jma_warning_hokubu', label: '北部' },
                { key: 'my_jma_warning_nanbu', label: '南部' },
                { key: 'my_jma_warning_kakogawa', label: '加古川' }
            ];

            regions.forEach(reg => {
                const regionBlock = document.createElement('div');
                regionBlock.className = 'warning-region-block';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'warning-region-title';
                titleDiv.textContent = `${reg.label}：`;
                regionBlock.appendChild(titleDiv);

                const rawWarnings = data[reg.key];
                let warningList = Array.isArray(rawWarnings) ? rawWarnings : (rawWarnings && typeof rawWarnings === 'object' ? [rawWarnings] : []);

                if (warningList.length > 0) {
                    warningList.forEach(w => {
                        const rowDiv = document.createElement('div');
                        rowDiv.className = 'warning-item-row';
                        rowDiv.textContent = JSON.stringify(w);
                        regionBlock.appendChild(rowDiv);
                    });
                } else {
                    const noneDiv = document.createElement('div');
                    noneDiv.className = 'warning-item-row warning-none';
                    noneDiv.textContent = '発令なし';
                    regionBlock.appendChild(noneDiv);
                }

                sec.appendChild(regionBlock);
            });

            wrapper.appendChild(sec);
            return wrapper;
        }

        function createDebugList(data) {
            const ul = document.createElement('ul');

            for (const key in data) {
                if (Object.prototype.hasOwnProperty.call(data, key)) {
                    const value = data[key];
                    const li = document.createElement('li');
                    const type = typeof value;
                    const isObjOrArray = value !== null && type === 'object';

                    if (isObjOrArray) {
                        li.classList.add('collapsed');

                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'toggle-btn';
                        toggleBtn.textContent = '▶';
                        toggleBtn.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(toggleBtn);

                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const typeTag = document.createElement('span');
                        typeTag.className = 'type-tag';
                        typeTag.textContent = Array.isArray(value) ? `[Array(${value.length})]` : '{Object}';
                        typeTag.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(typeTag);
                        
                        li.appendChild(createDebugList(value));
                    } else {
                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const valSpan = document.createElement('span');
                        valSpan.className = type;
                        valSpan.textContent = JSON.stringify(value);
                        li.appendChild(valSpan);
                    }

                    ul.appendChild(li);
                }
            }
            return ul;
        }

        fetchAndUpdateViewer();
    </script>
</body>
</html>
