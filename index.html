<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気ツール</title>
</head>
<body>
    <div id="app"></div>

    <script>
        // スタイルを動的に生成して適用
        const style = document.createElement('style');
        style.textContent = `
            body {
                font-family: monospace;
                background-color: #1e1e1e;
                color: #d4d4d4;
                padding: 20px;
                margin: 0;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #333;
                padding-bottom: 10px;
                margin-bottom: 15px;
            }
            h1 {
                font-size: 1.2rem;
                color: #4ec9b0;
                margin: 0;
                border: none;
                padding: 0;
            }
            .update-info {
                font-size: 0.85rem;
                color: #9cdcfe;
            }
            /* タブ切り替え用スタイルの追加 */
            .tab-nav {
                display: flex;
                gap: 10px;
                margin-bottom: 15px;
            }
            .tab-btn {
                background-color: #2d2d2d;
                color: #d4d4d4;
                border: 1px solid #404040;
                padding: 6px 14px;
                cursor: pointer;
                font-family: monospace;
                border-radius: 4px;
            }
            .tab-btn.active {
                background-color: #0e639c;
                border-color: #1177bb;
                color: #ffffff;
            }
            .page-pane {
                display: none;
            }
            .page-pane.active {
                display: block;
            }
            /* ページ2（天気表示用）のシンプルスタイル */
            .weather-section {
                margin-bottom: 20px;
                background-color: #252526;
                padding: 15px;
                border-radius: 6px;
                border: 1px solid #333;
            }
            .weather-section h2 {
                font-size: 1rem;
                color: #4ec9b0;
                margin-top: 0;
                margin-bottom: 10px;
                border-bottom: 1px solid #333;
                padding-bottom: 5px;
            }
            .weather-card-container {
                display: flex;
                gap: 10px;
                overflow-x: auto;
                padding-bottom: 5px;
            }
            .weather-card {
                background-color: #1e1e1e;
                border: 1px solid #333;
                padding: 10px;
                min-width: 110px;
                border-radius: 4px;
                font-size: 0.85rem;
                text-align: center;
            }
            ul {
                list-style-type: none;
                padding-left: 20px;
                margin: 4px 0;
                border-left: 1px dotted #404040;
            }
            li {
                margin: 2px 0;
            }
            .key {
                color: #9cdcfe;
                font-weight: bold;
            }
            .string { color: #ce9178; }
            .number { color: #b5cea8; }
            .boolean { color: #569cd6; }
            .null { color: #569cd6; }
            .type-tag {
                font-size: 0.8rem;
                color: #858585;
                margin-left: 6px;
                cursor: pointer;
                user-select: none;
            }
            .type-tag:hover {
                color: #d4d4d4;
            }
            .toggle-btn {
                background: none;
                border: none;
                color: #4ec9b0;
                cursor: pointer;
                font-family: monospace;
                font-size: 0.9rem;
                padding: 0 4px 0 0;
            }
            .toggle-btn:hover {
                color: #9cdcfe;
            }
            .collapsed > ul {
                display: none;
            }
            .error { color: #f44747; }
        `;
        document.head.appendChild(style);

        let lastKnownUpdateTime = null;
        let isFirstLoad = true;
        let pollTimer = null;
        let isFetching = false;
        let currentTab = 'page1'; // 現在選択されているタブを管理

        // アプリケーションの初期化・データフェッチ処理
        async function fetchAndUpdateViewer() {
            if (isFetching) return;
            isFetching = true;

            const app = document.getElementById('app');
            
            if (isFirstLoad) {
                const header = document.createElement('header');
                
                const title = document.createElement('h1');
                title.textContent = 'JSON Viewer & Weather App';
                header.appendChild(title);

                const updateInfo = document.createElement('div');
                updateInfo.id = 'update-info';
                updateInfo.className = 'update-info';
                updateInfo.textContent = '更新時刻を確認中...';
                header.appendChild(updateInfo);

                app.appendChild(header);

                // タブ切り替え用のナビゲーションを生成
                const tabNav = document.createElement('div');
                tabNav.className = 'tab-nav';
                
                const btnPage1 = document.createElement('button');
                btnPage1.className = 'tab-btn active';
                btnPage1.textContent = 'ページ1: JSONデバッグ';
                btnPage1.onclick = () => switchTab('page1', btnPage1, btnPage2);
                tabNav.appendChild(btnPage1);

                const btnPage2 = document.createElement('button');
                btnPage2.className = 'tab-btn';
                btnPage2.textContent = 'ページ2: 天気情報表示';
                btnPage2.onclick = () => switchTab('page2', btnPage2, btnPage1);
                tabNav.appendChild(btnPage2);

                app.appendChild(tabNav);

                // ページ1（デバッグ用コンテナ）を生成
                const pane1 = document.createElement('div');
                pane1.id = 'pane-page1';
                pane1.className = 'page-pane active';
                const container1 = document.createElement('main');
                container1.id = 'content-container';
                pane1.appendChild(container1);
                app.appendChild(pane1);

                // ページ2（天気表示用コンテナ）を生成
                const pane2 = document.createElement('div');
                pane2.id = 'pane-page2';
                pane2.className = 'page-pane';
                const container2 = document.createElement('main');
                container2.id = 'weather-container';
                pane2.appendChild(container2);
                app.appendChild(pane2);
            }

            try {
                const response = await fetch(`data.json?_=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const jsonData = await response.json();
                const currentUpdateTime = jsonData.json_updatetime || '不明';

                const updateInfoEl = document.getElementById('update-info');
                if (updateInfoEl) {
                    updateInfoEl.textContent = `データ更新時刻: ${currentUpdateTime}`;
                }

                if (isFirstLoad || lastKnownUpdateTime !== currentUpdateTime) {
                    if (!isFirstLoad && lastKnownUpdateTime !== null) {
                        console.log(`新着データを検知しました。更新時刻: ${currentUpdateTime}`);
                    }
                    lastKnownUpdateTime = currentUpdateTime;

                    // ページ1の内容を更新
                    const container1 = document.getElementById('content-container');
                    container1.innerHTML = '';
                    container1.appendChild(createDebugList(jsonData));

                    // ページ2（天気表示）の内容を更新
                    const container2 = document.getElementById('weather-container');
                    container2.innerHTML = '';
                    container2.appendChild(createWeatherView(jsonData));

                    isFirstLoad = false;
                }
            } catch (error) {
                if (isFirstLoad) {
                    const container1 = document.getElementById('content-container');
                    container1.innerHTML = `<span class="error">データの読み込みに失敗しました: ${error.message}<br>※ローカル環境(file://)の場合はCORS制限がかかるため、簡易サーバー等でお試しください。</span>`;
                } else {
                    console.warn(`バックグラウンドでのデータ確認に失敗しました: ${error.message}`);
                }
            } finally {
                isFetching = false;
                if (!document.hidden) {
                    scheduleNextCheck();
                }
            }
        }

        // タブ切り替え処理を行う関数
        function switchTab(targetPage, activeBtn, inactiveBtn) {
            currentTab = targetPage;
            activeBtn.classList.add('active');
            inactiveBtn.classList.remove('active');

            document.getElementById('pane-page1').classList.toggle('active', targetPage === 'page1');
            document.getElementById('pane-page2').classList.toggle('active', targetPage === 'page2');
        }

        function scheduleNextCheck() {
            if (pollTimer) clearTimeout(pollTimer);
            let delayMs = 60000;
            if (lastKnownUpdateTime) {
                const updateTimeMs = new Date(lastKnownUpdateTime.replace(' ', 'T') + '+09:00').getTime();
                const nowMs = Date.now();
                const tenMinutesMs = 10 * 60 * 1000;
                const elapsedMs = nowMs - updateTimeMs;
                if (elapsedMs < tenMinutesMs) {
                    delayMs = tenMinutesMs - elapsedMs;
                } else {
                    delayMs = 60 * 1000;
                }
            }
            pollTimer = setTimeout(fetchAndUpdateViewer, delayMs);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (pollTimer) clearTimeout(pollTimer);
                fetchAndUpdateViewer();
            } else {
                if (pollTimer) clearTimeout(pollTimer);
            }
        });

        // 天気情報データを視覚的なレイアウトに変換する関数
        function createWeatherView(data) {
            const wrapper = document.createElement('div');

            // 注意報セクションの生成
            if (data.jma_warning_kakogawa && data.jma_warning_kakogawa.length > 0) {
                const warnSec = document.createElement('div');
                warnSec.className = 'weather-section';
                warnSec.innerHTML = '<h2>気象注意報（加古川市）</h2>';
                data.jma_warning_kakogawa.forEach(w => {
                    const item = document.createElement('div');
                    item.style.marginBottom = '6px';
                    item.innerHTML = `⚠️ <strong>${w.code_jp}</strong> (${w.status})`;
                    warnSec.appendChild(item);
                });
                wrapper.appendChild(warnSec);
            }

            // 1時間ごとの天気セクションの生成
            if (data.hourly_1h && data.hourly_1h.length > 0) {
                const h1Sec = document.createElement('div');
                h1Sec.className = 'weather-section';
                h1Sec.innerHTML = '<h2>1時間ごとの天気</h2>';
                
                const cardContainer = document.createElement('div');
                cardContainer.className = 'weather-card-container';
                
                data.hourly_1h.forEach(h => {
                    const card = document.createElement('div');
                    card.className = 'weather-card';
                    const timeStr = h.time_1h.replace('T', ' ');
                    card.innerHTML = `
                        <div>${timeStr}</div>
                        <div style="font-size: 1.1rem; font-weight: bold; margin: 4px 0;">${h.temperature_1h}℃</div>
                        <div>降水: ${h.precipitation_1h}mm</div>
                        <div>風速: ${h.wind_speed_1h}m/s</div>
                    `;
                    cardContainer.appendChild(card);
                });
                h1Sec.appendChild(cardContainer);
                wrapper.appendChild(h1Sec);
            }

            // 3時間ごとの天気セクションの生成
            if (data.hourly_3h && data.hourly_3h.length > 0) {
                const h3Sec = document.createElement('div');
                h3Sec.className = 'weather-section';
                h3Sec.innerHTML = '<h2>3時間ごとの天気</h2>';
                
                const cardContainer = document.createElement('div');
                cardContainer.className = 'weather-card-container';
                
                data.hourly_3h.forEach(h => {
                    const card = document.createElement('div');
                    card.className = 'weather-card';
                    const timeStr = h.time_3h.replace('T', ' ');
                    card.innerHTML = `
                        <div>${timeStr}</div>
                        <div style="font-size: 1.1rem; font-weight: bold; margin: 4px 0;">${h.temperature_3h}℃</div>
                        <div>降水: ${h.precipitation_3h}mm</div>
                    `;
                    cardContainer.appendChild(card);
                });
                h3Sec.appendChild(cardContainer);
                wrapper.appendChild(h3Sec);
            }

            // 1日ごとの天気（週間天気）セクションの生成
            if (data.daily_1day && data.daily_1day.length > 0) {
                const dailySec = document.createElement('div');
                dailySec.className = 'weather-section';
                dailySec.innerHTML = '<h2>1日ごとの天気（週間）</h2>';
                
                const cardContainer = document.createElement('div');
                cardContainer.className = 'weather-card-container';
                
                data.daily_1day.forEach(d => {
                    const card = document.createElement('div');
                    card.className = 'weather-card';
                    card.style.minWidth = '130px';
                    card.innerHTML = `
                        <div>${d.time_1day}</div>
                        <div style="margin: 4px 0;">
                            <span style="color: #f44747;">最高 ${d.temperature_max_1day}℃</span><br>
                            <span style="color: #9cdcfe;">最低 ${d.temperature_min_1day}℃</span>
                        </div>
                        <div>降水確率: ${d.precipitation_probability_max_1day}%</div>
                    `;
                    cardContainer.appendChild(card);
                });
                dailySec.appendChild(cardContainer);
                wrapper.appendChild(dailySec);
            }

            return wrapper;
        }

        // オブジェクトを再帰的に走査して開閉可能なツリー状DOMを生成する関数
        function createDebugList(data) {
            const ul = document.createElement('ul');

            for (const key in data) {
                if (Object.prototype.hasOwnProperty.call(data, key)) {
                    const value = data[key];
                    const li = document.createElement('li');
                    
                    const type = typeof value;
                    const isObjOrArray = value !== null && type === 'object';

                    if (isObjOrArray) {
                        li.classList.add('collapsed'); // デフォルトは折りたたみ状態

                        // 開閉用のボタンを作成
                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'toggle-btn';
                        toggleBtn.textContent = '▶';
                        toggleBtn.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(toggleBtn);

                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const typeTag = document.createElement('span');
                        typeTag.className = 'type-tag';
                        typeTag.textContent = Array.isArray(value) ? `[Array(${value.length})]` : '{Object}';
                        typeTag.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(typeTag);
                        
                        li.appendChild(createDebugList(value));
                    } else {
                        // オブジェクト/配列ではない通常のキー・値
                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const valSpan = document.createElement('span');
                        valSpan.className = type;
                        valSpan.textContent = JSON.stringify(value);
                        li.appendChild(valSpan);
                    }

                    ul.appendChild(li);
                }
            }
            return ul;
        }

        // 初回実行
        fetchAndUpdateViewer();
    </script>
</body>
</html>
