<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Debug Viewer</title>
</head>
<body>
    <div id="app"></div>

    <script>
        // スタイルを動的に生成して適用
        const style = document.createElement('style');
        style.textContent = `
            body {
                font-family: monospace;
                background-color: #1e1e1e;
                color: #d4d4d4;
                padding: 20px;
                margin: 0;
            }
            h1 {
                font-size: 1.2rem;
                color: #4ec9b0;
                border-bottom: 1px solid #333;
                padding-bottom: 10px;
            }
            ul {
                list-style-type: none;
                padding-left: 20px;
                margin: 4px 0;
                border-left: 1px dotted #404040;
            }
            li {
                margin: 2px 0;
            }
            .key {
                color: #9cdcfe;
                font-weight: bold;
            }
            .string { color: #ce9178; }
            .number { color: #b5cea8; }
            .boolean { color: #569cd6; }
            .null { color: #569cd6; }
            .type-tag {
                font-size: 0.8rem;
                color: #858585;
                margin-left: 6px;
            }
            .error { color: #f44747; }
        `;
        document.head.appendChild(style);

        // アプリケーションの初期化・描画処理
        async function initDebugViewer() {
            const app = document.getElementById('app');

            // タイトル要素をJavaScriptで生成
            const title = document.createElement('h1');
            title.textContent = 'JSON Debug Viewer (data.json)';
            app.appendChild(title);

            // コンテンツコンテナ
            const container = document.createElement('main');
            container.textContent = '読み込み中...';
            app.appendChild(container);

            try {
                const response = await fetch('data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const jsonData = await response.json();
                
                container.innerHTML = '';
                container.appendChild(createDebugList(jsonData));
            } catch (error) {
                container.innerHTML = `<span class="error">データの読み込みに失敗しました: ${error.message}<br>※ローカル環境(file://)の場合はCORS制限がかかるため、簡易サーバー等でお試しください。</span>`;
            }
        }

        // オブジェクトを再帰的に走査してツリー状のDOMを生成する関数
        function createDebugList(data) {
            const ul = document.createElement('ul');

            for (const key in data) {
                if (Object.prototype.hasOwnProperty.call(data, key)) {
                    const value = data[key];
                    const li = document.createElement('li');
                    
                    const keySpan = document.createElement('span');
                    keySpan.className = 'key';
                    keySpan.textContent = key + ': ';
                    li.appendChild(keySpan);

                    const type = typeof value;

                    if (value !== null && type === 'object') {
                        const typeTag = document.createElement('span');
                        typeTag.className = 'type-tag';
                        typeTag.textContent = Array.isArray(value) ? `[Array(${value.length})]` : '{Object}';
                        li.appendChild(typeTag);
                        
                        li.appendChild(createDebugList(value));
                    } else {
                        const valSpan = document.createElement('span');
                        valSpan.className = type;
                        valSpan.textContent = JSON.stringify(value);
                        li.appendChild(valSpan);
                    }

                    ul.appendChild(li);
                }
            }
            return ul;
        }

        // 実行
        initDebugViewer();
    </script>
</body>
</html>
