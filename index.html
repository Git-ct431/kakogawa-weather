<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気ツール</title>
    <!-- ちらつき防止：HTML描画の最優先でテーマを適用 -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('weather_tool_theme');
            if (savedTheme !== 'light') {
                document.documentElement.classList.add('dark-mode-preload');
                // document.body がまだ存在しないため、DOM読み込み時にbodyへ付与するためのフラグまたは即時処理用
            }
        })();
    </script>
</head>
<body>
    <script>
        // ちらつきを完全に防ぐため、body生成直後にクラスを即座に付与
        (function() {
            const savedTheme = localStorage.getItem('weather_tool_theme');
            if (savedTheme !== 'light') {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <div id="app"></div>

    <script>
        const style = document.createElement('style');
        style.textContent = `
            :root {
                --bg-color: #dee2e6;
                --text-color: #333333;
                --header-border: #cccccc;
                --panel-border: #cccccc;
                --btn-bg: #e9ecef;
                --btn-color: #333333;
                --btn-border: #ced4da;
                --btn-active-bg: #007acc;
                --btn-active-border: #005999;
                --btn-active-color: #ffffff;
                --th-bg: #ced4da;
                --th-color: #005fb8;
                --table-border: #cccccc;
                --badge-bg: #ced4da;
                --badge-color: #333333;
                --badge-border: #adb5bd;
                --update-color: #005fb8;
                --key-color: #001080;
                --string-color: #a31515;
                --number-color: #098658;
                --boolean-color: #0000ff;
                --type-tag-color: #717171;
                --toggle-color: #005fb8;
                --zero-color: #777777;
                --warning-block-bg: #e9ecef;
            }

            body.dark-mode {
                --bg-color: #1e1e1e;
                --text-color: #d4d4d4;
                --header-border: #333333;
                --panel-border: #333333;
                --btn-bg: #2d2d2d;
                --btn-color: #d4d4d4;
                --btn-border: #404040;
                --btn-active-bg: #0e639c;
                --btn-active-border: #1177bb;
                --btn-active-color: #ffffff;
                --th-bg: #2d2d2d;
                --th-color: #4ec9b0;
                --table-border: #333333;
                --badge-bg: #333333;
                --badge-color: #ffffff;
                --badge-border: #555555;
                --update-color: #9cdcfe;
                --key-color: #9cdcfe;
                --string-color: #ce9178;
                --number-color: #b5cea8;
                --boolean-color: #569cd6;
                --type-tag-color: #858585;
                --toggle-color: #4ec9b0;
                --zero-color: #777777;
                --warning-block-bg: #1e1e1e;
            }

            body { font-family: monospace; background-color: var(--bg-color); color: var(--text-color); padding: 2px; margin: 0; }
            header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--header-border); padding-bottom: 0px; margin-bottom: 15px; }
            .header-left { display: flex; align-items: center; gap: 15px; }
            .header-right { display: flex; align-items: center; gap: 10px; }
            h1 { font-size: 1.2rem; color: var(--th-color); margin: 0; border: none; padding: 0; }
            .update-info { font-size: 0.85rem; color: var(--update-color); }
            
            .tab-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
            .tab-btn { background-color: var(--btn-bg); color: var(--btn-color); border: 1px solid var(--btn-border); padding: 6px 14px; cursor: pointer; font-family: monospace; border-radius: 4px; }
            .tab-btn.active { background-color: var(--btn-active-bg); border-color: var(--btn-active-border); color: var(--btn-active-color); }
            .warning-level-high-tab { background-color: #a31515 !important; border-color: #f44747 !important; color: #ffffff !important; }

            .page-pane { display: none; }
            .page-pane.active { display: block; }
            
            .fixed-size-pane { width: auto; height: auto; border: 1px solid var(--panel-border); overflow: auto; box-sizing: border-box; padding: 20px; cursor: pointer; position: relative; background-color: var(--bg-color); }
            .fixed-size-pane::after { content: "クリックで最大表示"; position: absolute; top: 5px; right: 8px; font-size: 0.75rem; color: var(--type-tag-color); opacity: 0.7; pointer-events: none; }

            #fullscreen-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100dvh;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 9999;
                display: flex;
                justify-content: center;
                align-items: center;
                box-sizing: border-box;
                cursor: pointer;
                overflow: hidden;
            }
            #fullscreen-inner-wrapper {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: flex-start;
                align-items: center;
                position: relative;
                overflow: hidden;
                background-color: var(--bg-color);
                border: 3px solid var(--table-border);
                box-sizing: border-box;
                padding: 5px;
            }
            #fullscreen-content-scale {
                transform-origin: left center;
                display: inline-block;
                margin-left: 5px;
            }
            #fullscreen-content-scale .weather-section h2 {
                display: none;
            }

            .weather-section { margin-bottom: 0; }
            .weather-section h2 { font-size: 1.2rem; color: var(--th-color); margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid var(--panel-border); padding-bottom: 6px; text-align: center; }
            
            .table-style-1 { width: auto; height: auto; border-collapse: collapse; background-color: var(--bg-color); border: 0.1em solid var(--table-border); font-size: 0.9rem; }
            .table-style-1 th, .table-style-1 td { text-align: center; border-bottom: none; border-right: 0.1em solid var(--table-border); white-space: nowrap; padding: 0px 0.5em 0px 0.5em; color: var(--text-color); }
            .table-style-1 td { border-bottom: none; }
            .table-style-1 th:last-child, .table-style-1 td:last-child { border-right: none; }
            
            .table-style-1 th { 
                background-color: var(--th-bg); 
                color: var(--th-color); 
                font-weight: bold; 
                writing-mode: vertical-rl; 
                text-orientation: upright; 
                padding: 6px 2px; 
                height: 90px; 
                vertical-align: bottom; 
                position: relative; 
            }
            .table-style-1 th span { 
                display: inline-block; 
                position: absolute;
                bottom: 6px; 
                left: 50%;
                transform: translateX(-50%);
            }

            .table-style-1 tr.current-time-row td {
                border-bottom: 0.2em solid var(--th-color) !important;
            }

            .val-zero {
                color: var(--zero-color) !important;
                opacity: 0.6;
            }

            body:not(.dark-mode) .temp-b3 { background-color: #cfe2f3; color: #0b3954; }
            body:not(.dark-mode) .temp-b2 { background-color: #d9eaf7; color: #0b3954; }
            body:not(.dark-mode) .temp-b1 { background-color: #e2f0fb; color: #1d4ed8; }
            body:not(.dark-mode) .temp-b0 { background-color: #edf5fe; color: #1d4ed8; }
            body:not(.dark-mode) .temp-g0 { background-color: #e2f4ed; color: #065f46; }
            body:not(.dark-mode) .temp-g1 { background-color: #d1f2e1; color: #065f46; }
            body:not(.dark-mode) .temp-g2 { background-color: #bbf7d0; color: #14532d; }
            body:not(.dark-mode) .temp-g3 { background-color: #a7f3d0; color: #14532d; }
            body:not(.dark-mode) .temp-r0 { background-color: #fef9c3; color: #713f12; }
            body:not(.dark-mode) .temp-r1 { background-color: #fef08a; color: #713f12; }
            body:not(.dark-mode) .temp-r2 { background-color: #fed7aa; color: #7c2d12; }
            body:not(.dark-mode) .temp-r3 { background-color: #fdba74; color: #7c2d12; }
            body:not(.dark-mode) .temp-r4 { background-color: #fecaca; color: #7f1d1d; }
            body:not(.dark-mode) .temp-r5 { background-color: #fbcfe8; color: #831843; }

            body.dark-mode .temp-b3 { background-color: #17324f; color: #9ac2ff; }
            body.dark-mode .temp-b2 { background-color: #1a3c5a; color: #9ac2ff; }
            body.dark-mode .temp-b1 { background-color: #1d4666; color: #92b8ea; }
            body.dark-mode .temp-b0 { background-color: #215175; color: #9cdcfe; }
            body.dark-mode .temp-g0 { background-color: #1b4d45; color: #9cdcfe; }
            body.dark-mode .temp-g1 { background-color: #1e583c; color: #b5cea8; }
            body.dark-mode .temp-g2 { background-color: #22642a; color: #b5cea8; }
            body.dark-mode .temp-g3 { background-color: #20713b; color: #ffffff; }
            body.dark-mode .temp-r0 { background-color: #575e24; color: #fef08a; }
            body.dark-mode .temp-r1 { background-color: #6b531d; color: #fef08a; }
            body.dark-mode .temp-r2 { background-color: #6b3e1d; color: #fed7aa; }
            body.dark-mode .temp-r3 { background-color: #6b2b1d; color: #fdba74; }
            body.dark-mode .temp-r4 { background-color: #6b1d1d; color: #fecaca; }
            body.dark-mode .temp-r5 { background-color: #5c1836; color: #fbcfe8; }

            .warning-region-block { margin-bottom: 8px; background-color: var(--warning-block-bg); border: 1px solid var(--panel-border); padding: 6px 12px; border-radius: 4px; }
            .warning-region-title { font-size: 1.05rem; color: var(--update-color); font-weight: bold; margin-bottom: 2px; border-bottom: 1px dotted var(--panel-border); padding-bottom: 2px; }
            .warning-item-row { display: flex; gap: 15px; margin: 1px 0; font-size: 0.95rem; }
            .warning-none { color: #858585; margin: 1px 0; }
            ul { list-style-type: none; padding-left: 20px; margin: 4px 0; border-left: 1px dotted var(--panel-border); }
            li.collapsed > ul { display: none; }
            li { margin: 2px 0; }
            .key { color: var(--key-color); font-weight: bold; }
            .string { color: var(--string-color); }
            .number { color: var(--number-color); }
            .boolean, .null { color: var(--boolean-color); }
            .type-tag { font-size: 0.8rem; color: var(--type-tag-color); margin-left: 6px; cursor: pointer; user-select: none; }
            .toggle-btn { background: none; border: none; color: var(--toggle-color); cursor: pointer; font-family: monospace; font-size: 0.9rem; padding: 0 4px 0 0; }
            .error { color: #f44747; }
        `;
        document.head.appendChild(style);

        let lastKnownUpdateTime = null;
        let isFirstLoad = true;
        let pollTimer = null;
        let isFetching = false;

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('weather_tool_theme', isDark ? 'dark' : 'light');
            const themeBtn = document.getElementById('theme-toggle-tab-btn');
            if (themeBtn) {
                themeBtn.textContent = isDark ? 'テーマ：ライト' : 'テーマ：ダーク';
            }
        }

        function getTempClass(key, val) {
            if (!key.includes('気温')) return '';
            const num = parseFloat(val);
            if (isNaN(num)) return '';
            const idx = Math.floor(num / 3);
            if (idx <= -2) return 'temp-b3';
            if (idx === -1) return 'temp-b2';
            if (idx === 0) return 'temp-b1';
            if (idx === 1) return 'temp-b0';
            if (idx === 2) return 'temp-g0';
            if (idx === 3) return 'temp-g1';
            if (idx === 4) return 'temp-g2';
            if (idx === 5) return 'temp-g3';
            if (idx === 6) return 'temp-r0';
            if (idx === 7) return 'temp-r1';
            if (idx === 8) return 'temp-r2';
            if (idx === 9) return 'temp-r3';
            if (idx === 10) return 'temp-r4';
            return 'temp-r5';
        }

        const renderTable = (data, container, highlightIndex = -1, customClassFn = null, enableMonthBoundary = false) => {
            if (!data.length) return;
            const keys = Object.keys(data[0]);
            
            const tbodyHtml = data.map((h, rowIndex) => {
                let rowClass = (rowIndex === highlightIndex) ? 'current-time-row' : '';

                let rowStyle = '';
                if (enableMonthBoundary && rowIndex > 0 && (h.月 || h.日)) {
                    rowStyle = ` style="border-top: 0.2em solid var(--table-border);"`;
                }

                const cellsHtml = keys.map(k => {
                    const val = h[k] ?? '-';
                    let cls = customClassFn ? customClassFn(k, val) : '';
                    
                    if (val === 0 || val === '0' || val === 0.0) {
                        cls = cls ? `${cls} val-zero` : 'val-zero';
                    }

                    return `<td${cls ? ` class="${cls}"` : ''}>${val}</td>`;
                }).join('');

                const classAttr = rowClass ? ` class="${rowClass}"` : '';
                return `<tr${classAttr}${rowStyle}>${cellsHtml}</tr>`;
            }).join('');

            container.innerHTML = `<table class="table-style-1"><thead><tr>${keys.map(k => `<th><span>${k}</span></th>`).join('')}</tr></thead><tbody>${tbodyHtml}</tbody></table>`;
        };

        function findCurrentTimeIndex(rawDataList) {
            if (!rawDataList || !rawDataList.length) return -1;
            const now = new Date().getTime();
            
            let intervalMs = 3 * 60 * 60 * 1000;
            if (rawDataList.length > 1 && rawDataList[0].時刻 && rawDataList[1].時刻) {
                const t1 = new Date(rawDataList[0].時刻.replace('T', ' ') + '+09:00').getTime();
                const t2 = new Date(rawDataList[1].時刻.replace('T', ' ') + '+09:00').getTime();
                intervalMs = t2 - t1;
            }
            
            let matchedIndex = -1;
            rawDataList.forEach((item, idx) => {
                if (item.時刻) {
                    const isoStr = item.時刻.replace('T', ' ') + '+09:00';
                    const itemTime = new Date(isoStr).getTime();
                    const nextTime = itemTime + intervalMs;
                    
                    if (now >= itemTime && now < nextTime) {
                        matchedIndex = idx;
                    }
                }
            });
            return matchedIndex;
        }

        async function fetchAndUpdateViewer() {
            if (isFetching) return;
            isFetching = true;

            const app = document.getElementById('app');
            
            if (isFirstLoad) {
                const header = document.createElement('header');
                
                const headerLeft = document.createElement('div');
                headerLeft.className = 'header-left';

                const title = document.createElement('h1');
                title.textContent = '天気ツール';
                headerLeft.appendChild(title);

                header.appendChild(headerLeft);

                const headerRight = document.createElement('div');
                headerRight.className = 'header-right';

                const updateInfo = document.createElement('div');
                updateInfo.id = 'update-info';
                updateInfo.className = 'update-info';
                updateInfo.textContent = '更新時刻を確認中...';
                headerRight.appendChild(updateInfo);

                header.appendChild(headerRight);
                app.appendChild(header);

                const tabNav = document.createElement('div');
                tabNav.className = 'tab-nav';
                
                const btnPage1 = document.createElement('button');
                btnPage1.className = 'tab-btn active';
                btnPage1.textContent = 'P1: JSONデバッグ';
                btnPage1.onclick = () => switchTab('page1', btnPage1);
                tabNav.appendChild(btnPage1);

                const btnPage2 = document.createElement('button');
                btnPage2.className = 'tab-btn';
                btnPage2.textContent = 'P2: 1時間天気';
                btnPage2.onclick = () => switchTab('page2', btnPage2);
                tabNav.appendChild(btnPage2);

                const btnPage3 = document.createElement('button');
                btnPage3.className = 'tab-btn';
                btnPage3.textContent = 'P3: 3時間天気';
                btnPage3.onclick = () => switchTab('page3', btnPage3);
                tabNav.appendChild(btnPage3);

                const btnPage4 = document.createElement('button');
                btnPage4.className = 'tab-btn';
                btnPage4.textContent = 'P4: 10日天気';
                btnPage4.onclick = () => switchTab('page4', btnPage4);
                tabNav.appendChild(btnPage4);

                const btnPage5 = document.createElement('button');
                btnPage5.id = 'btn-page5';
                btnPage5.className = 'tab-btn';
                btnPage5.textContent = 'P5: 気象警報 (LV: -)';
                btnPage5.onclick = () => switchTab('page5', btnPage5);
                tabNav.appendChild(btnPage5);

                const themeToggleTabBtn = document.createElement('button');
                themeToggleTabBtn.id = 'theme-toggle-tab-btn';
                themeToggleTabBtn.className = 'tab-btn';
                const isCurrentDark = document.body.classList.contains('dark-mode');
                themeToggleTabBtn.textContent = isCurrentDark ? 'テーマ：ライト' : 'テーマ：ダーク';
                themeToggleTabBtn.onclick = toggleTheme;
                tabNav.appendChild(themeToggleTabBtn);

                app.appendChild(tabNav);

                const pane1 = document.createElement('div');
                pane1.id = 'pane-page1';
                pane1.className = 'page-pane active';
                const container1 = document.createElement('main');
                container1.id = 'content-container';
                pane1.appendChild(container1);
                app.appendChild(pane1);

                const pane2 = document.createElement('div');
                pane2.id = 'pane-page2';
                pane2.className = 'page-pane fixed-size-pane';
                const container2 = document.createElement('div');
                container2.id = 'weather-1h-container';
                pane2.appendChild(container2);
                pane2.onclick = () => openFullscreenOverlay(container2);
                app.appendChild(pane2);

                const pane3 = document.createElement('div');
                pane3.id = 'pane-page3';
                pane3.className = 'page-pane fixed-size-pane';
                const container3 = document.createElement('div');
                container3.id = 'weather-3h-container';
                pane3.appendChild(container3);
                pane3.onclick = () => openFullscreenOverlay(container3);
                app.appendChild(pane3);

                const pane4 = document.createElement('div');
                pane4.id = 'pane-page4';
                pane4.className = 'page-pane fixed-size-pane';
                const container4 = document.createElement('div');
                container4.id = 'weather-10d-container';
                pane4.appendChild(container4);
                pane4.onclick = () => openFullscreenOverlay(container4);
                app.appendChild(pane4);

                const pane5 = document.createElement('div');
                pane5.id = 'pane-page5';
                pane5.className = 'page-pane fixed-size-pane';
                const container5 = document.createElement('div');
                container5.id = 'weather-warnings-container';
                pane5.appendChild(container5);
                app.appendChild(pane5);
            }

            try {
                const response = await fetch(`data.json?_=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const jsonData = await response.json();
                
                const currentUpdateTime = jsonData.my_json_updatetime || '不明';
                const updateInfoEl = document.getElementById('update-info');
                if (updateInfoEl) updateInfoEl.textContent = `データ更新時刻: ${currentUpdateTime}`;

                const btnPage5 = document.getElementById('btn-page5');
                if (btnPage5 && jsonData.my_jma_warning_kakogawa) {
                    const warningLevel = jsonData.my_jma_warning_kakogawa["最大気象警報レベル"] ?? 0;
                    btnPage5.textContent = `P5: 気象警報 (LV: ${warningLevel})`;
                    if (warningLevel > 0) {
                        btnPage5.classList.add('warning-level-high-tab');
                    } else {
                        btnPage5.classList.remove('warning-level-high-tab');
                    }
                }

                if (isFirstLoad || lastKnownUpdateTime !== currentUpdateTime) {
                    lastKnownUpdateTime = currentUpdateTime;

                    document.getElementById('content-container').innerHTML = '';
                    document.getElementById('content-container').appendChild(createDebugList(jsonData));

                    document.getElementById('weather-1h-container').innerHTML = '';
                    document.getElementById('weather-1h-container').appendChild(create1HourWeatherView(jsonData));

                    document.getElementById('weather-3h-container').innerHTML = '';
                    document.getElementById('weather-3h-container').appendChild(create3HourWeatherView(jsonData));

                    document.getElementById('weather-10d-container').innerHTML = '';
                    document.getElementById('weather-10d-container').appendChild(create10DayWeatherView(jsonData));

                    document.getElementById('weather-warnings-container').innerHTML = '';
                    document.getElementById('weather-warnings-container').appendChild(createWeatherWarningsView(jsonData));

                    isFirstLoad = false;
                }
            } catch (error) {
                if (isFirstLoad) {
                    document.getElementById('content-container').innerHTML = `<span class="error">データの読み込みに失敗しました: ${error.message}</span>`;
                } else {
                    console.warn(`バックグラウンドでのデータ確認に失敗しました: ${error.message}`);
                }
            } finally {
                isFetching = false;
                if (!document.hidden) scheduleNextCheck();
            }
        }

        function openFullscreenOverlay(sourceContainer) {
            if (document.getElementById('fullscreen-overlay')) return;

            const overlay = document.createElement('div');
            overlay.id = 'fullscreen-overlay';

            const innerWrapper = document.createElement('div');
            innerWrapper.id = 'fullscreen-inner-wrapper';

            const contentScale = document.createElement('div');
            contentScale.id = 'fullscreen-content-scale';
            
            contentScale.innerHTML = sourceContainer.innerHTML;
            innerWrapper.appendChild(contentScale);
            overlay.appendChild(innerWrapper);

            overlay.onclick = () => {
                document.body.removeChild(overlay);
            };

            document.body.appendChild(overlay);

            setTimeout(() => {
                const wWidth = innerWrapper.clientWidth;
                const wHeight = innerWrapper.clientHeight;
                const iWidth = contentScale.scrollWidth;
                const iHeight = contentScale.scrollHeight;

                if (iWidth > 0 && iHeight > 0) {
                    const scaleX = wWidth / iWidth;
                    const scaleY = wHeight / iHeight;
                    const scale = Math.min(scaleX, scaleY) * 0.99; 
                    contentScale.style.transform = `scale(${scale})`;
                }
            }, 30);
        }

        function switchTab(targetId, activeBtn) {
            document.querySelectorAll('.tab-btn:not(#theme-toggle-tab-btn)').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page-pane').forEach(pane => pane.classList.remove('active'));

            activeBtn.classList.add('active');
            const targetPane = document.getElementById(`pane-${targetId}`);
            targetPane.classList.add('active');
        }

        window.addEventListener('resize', () => {
            const overlayScale = document.getElementById('fullscreen-content-scale');
            const overlayWrapper = document.getElementById('fullscreen-inner-wrapper');
            if (overlayScale && overlayWrapper) {
                overlayScale.style.transform = 'none';
                const wWidth = overlayWrapper.clientWidth;
                const wHeight = overlayWrapper.clientHeight;
                const iWidth = overlayScale.scrollWidth;
                const iHeight = overlayScale.scrollHeight;
                if (iWidth > 0 && iHeight > 0) {
                    const scale = Math.min(wWidth / iWidth, wHeight / iHeight) * 0.99;
                    overlayScale.style.transform = `scale(${scale})`;
                }
            }
        });

        function scheduleNextCheck() {
            if (pollTimer) clearTimeout(pollTimer);
            let delayMs = 60000;
            if (lastKnownUpdateTime) {
                const updateTimeMs = new Date(lastKnownUpdateTime.replace(' ', 'T') + '+09:00').getTime();
                const nowMs = Date.now();
                const tenMinutesMs = 10 * 60 * 1000;
                const elapsedMs = nowMs - updateTimeMs;
                delayMs = (elapsedMs < tenMinutesMs) ? (tenMinutesMs - elapsedMs) : 60000;
            }
            pollTimer = setTimeout(fetchAndUpdateViewer, delayMs);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                if (pollTimer) clearTimeout(pollTimer);
                fetchAndUpdateViewer();
            } else {
                if (pollTimer) clearTimeout(pollTimer);
            }
        });

        function create1HourWeatherView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>1時間ごとの天気</h2>';

            if (data.my_weather_1h && data.my_weather_1h.length > 0) {
                const container = document.createElement('div');
                const limitedList = data.my_weather_1h.slice(0, 24);
                const targetIndex = findCurrentTimeIndex(limitedList);
                const detailsList = limitedList.map(h => h.詳細 || {});
                renderTable(detailsList, container, targetIndex, getTempClass, false);
                sec.appendChild(container);
            } else {
                sec.innerHTML += '<p>データがありません。</p>';
            }

            wrapper.appendChild(sec);
            return wrapper;
        }

        function create3HourWeatherView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');

            sec.innerHTML = '<h2>3時間ごとの天気</h2>';

            if (data.my_weather_3h && data.my_weather_3h.length > 0) {

        function createWeatherWarningsView(data) {
            const wrapper = document.createElement('div');
            const sec = document.createElement('div');
            sec.className = 'weather-section';
            sec.innerHTML = '<h2>気象警報・注意報</h2>';

            const regions = [
                { key: 'my_jma_warning_hokubu', label: '北部' },
                { key: 'my_jma_warning_nanbu', label: '南部' },
                { key: 'my_jma_warning_kakogawa', label: '加古川' }
            ];

            regions.forEach(reg => {
                const regionBlock = document.createElement('div');
                regionBlock.className = 'warning-region-block';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'warning-region-title';
                titleDiv.textContent = `${reg.label}：`;
                regionBlock.appendChild(titleDiv);

                const rawWarnings = data[reg.key];
                let warningList = Array.isArray(rawWarnings) ? rawWarnings : (rawWarnings && typeof rawWarnings === 'object' ? [rawWarnings] : []);

                if (warningList.length > 0) {
                    warningList.forEach(w => {
                        const rowDiv = document.createElement('div');
                        rowDiv.className = 'warning-item-row';
                        rowDiv.textContent = JSON.stringify(w);
                        regionBlock.appendChild(rowDiv);
                    });
                } else {
                    const noneDiv = document.createElement('div');
                    noneDiv.className = 'warning-item-row warning-none';
                    noneDiv.textContent = '発令なし';
                    regionBlock.appendChild(noneDiv);
                }

                sec.appendChild(regionBlock);
            });

            wrapper.appendChild(sec);
            return wrapper;
        }

        function createDebugList(data) {
            const ul = document.createElement('ul');

            for (const key in data) {
                if (Object.prototype.hasOwnProperty.call(data, key)) {
                    const value = data[key];
                    const li = document.createElement('li');
                    const type = typeof value;
                    const isObjOrArray = value !== null && type === 'object';

                    if (isObjOrArray) {
                        li.classList.add('collapsed');

                        const toggleBtn = document.createElement('button');
                        toggleBtn.className = 'toggle-btn';
                        toggleBtn.textContent = '▶';
                        toggleBtn.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(toggleBtn);

                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const typeTag = document.createElement('span');
                        typeTag.className = 'type-tag';
                        typeTag.textContent = Array.isArray(value) ? `[Array(${value.length})]` : '{Object}';
                        typeTag.onclick = () => {
                            const isCollapsed = li.classList.toggle('collapsed');
                            toggleBtn.textContent = isCollapsed ? '▶' : '▼';
                        };
                        li.appendChild(typeTag);
                        
                        li.appendChild(createDebugList(value));
                    } else {
                        const keySpan = document.createElement('span');
                        keySpan.className = 'key';
                        keySpan.textContent = key + ': ';
                        li.appendChild(keySpan);

                        const valSpan = document.createElement('span');
                        valSpan.className = type;
                        valSpan.textContent = JSON.stringify(value);
                        li.appendChild(valSpan);
                    }

                    ul.appendChild(li);
                }
            }
            return ul;
        }

        fetchAndUpdateViewer();
    </script>
</body>
