name: Update Weather Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Record start time
        run: echo "START_TIME=$(date +%s.%N)" >> $GITHUB_ENV

      - name: Run fetch script
        run: python fetch_weather.py

      - name: Commit and push if changed
        run: |
          END_TIME=$(date +%s.%N)
          DURATION=$(echo "$END_TIME - ${{ env.START_TIME }}" | bc)
          FORMATTED_TIME=$(printf "%.2f" $DURATION)

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "run every 10minutes, action time: ${FORMATTED_TIME}s [skip ci]" && git push)